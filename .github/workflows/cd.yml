name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          name: Rina OS Workspace ${{ github.ref_name }}
          files: |
            package.json
          body: |
            ## Rina OS Dev Workspace Release ${{ github.ref_name }}
            
            Automated release from your personal software factory.
